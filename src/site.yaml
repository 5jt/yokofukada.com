# Site-wide settings and navigation.
# To add a page: put a Markdown file in src/pages/ and add a line to `nav`.

name: Yoko Fukada
email: yoko@yokofukada.com
# {year} becomes the year the site is built.
copyright: "© Yoko Fukada 2006–{year}"
keywords: Yoko Fukada, art, tapestry, tapestries, obi, maru-obi, hikinuki-obi, Re-Born, textile, jewellery

# The Tapestries page is the landing page, so it is built as index.html.
# Each entry: page (output file name without .html), English label, Japanese label.
# `section` marks pages that light up this entry too (e.g. the individual works pages).
nav:
  - {page: index,     en: tapestries, ja: タペストリー}
  - {page: works,     en: works,     ja: アート作品, section: work}
  - {page: jewellery, en: jewellery, ja: ジュエリー}
  - {page: aboutme,   en: about me,  ja: プロフィール}
