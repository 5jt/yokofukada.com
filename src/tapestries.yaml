# The Tapestries page, following Miki's sketch (plans/Yoko Fukada.png).
#
# Each piece:
#   number: catalogue number, shown before the title
#   title: as given by Miki (from her file names)
#   shape: tall, square or wide (wide pieces take a row of their own)
#   art:   original in src/art/ (one, or a list for a piece in several strips)
#   file:  web copy in src/img/, made by lib/prepare_images.py
# Without art/file, the page shows a placeholder.
# A section's `columns` sets how many pieces fit in a row (default 5).

title: Tapestries
ja: タペストリー
contact: Send me a message
credit: "Photography by: Hideto Ichige"

