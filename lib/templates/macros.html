{% macro figure(img, cls="") %}
<figure{% if cls %} class="{{ cls }}"{% endif %}>
  <img src="images/{{ img.file }}" width="{{ img.width }}" height="{{ img.height }}" alt="{{ img.en }}">
  <figcaption>{{ img.en }}{% if img.ja is defined %}<br><span lang="ja">{{ img.ja }}</span>{% endif %}</figcaption>
</figure>
{% endmacro %}

{% macro lightbox(label) %}
{# Filled by js/lightbox.js; any click, or Esc, closes it. #}
<dialog class="lightbox" aria-label="{{ label }}"><div class="content"></div></dialog>
{% endmacro %}
