{% extends "base.html" %}
{% from "macros.html" import lightbox %}
{% block main %}
<h1>{{ gallery.title }}</h1>
<ul class="jewellery gallery">
{% for img in images %}
  <li><a href="images/{{ img.file }}"><img src="images/{{ img.file }}" width="{{ img.width }}" height="{{ img.height }}" alt="{{ gallery.alt }}"></a></li>
{% endfor %}
</ul>
<p class="credit">{{ gallery.credit }}</p>
{{ lightbox(gallery.title) }}
{% endblock %}
{% block scripts %}<script src="js/lightbox.js?v={{ v.lightbox }}"></script>{% endblock %}
